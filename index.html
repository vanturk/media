<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>FPO media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F8F9;
    --ink: #1B2430;
    --ink-soft: #5B6875;
    --guide: #8FCFE6;      /* non-photo blue */
    --crop: #9AA7B2;
    --hit: #D4006F;        /* copy confirmation */
    --tile: #E7ECEF;
    --gutter: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12171D;
      --ink: #E9EEF2;
      --ink-soft: #97A4B0;
      --guide: #2F6F86;
      --crop: #5F6E7B;
      --hit: #FF4FA3;
      --tile: #1C232B;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.5 "Archivo", system-ui, sans-serif;
    font-variation-settings: "wdth" 100;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 var(--gutter); }
  @media (min-width: 720px) { :root { --gutter: 32px; } }

  /* Header: the FPO box */
  .masthead { padding-top: 40px; padding-bottom: 28px; display: grid; gap: 20px; }
  @media (min-width: 720px) {
    .masthead { grid-template-columns: auto 1fr; align-items: end; gap: 32px; padding-top: 56px; }
  }
  .fpo {
    position: relative;
    width: min(100%, 360px);
    aspect-ratio: 360 / 150;
    border: 1.5px solid var(--guide);
    display: grid;
    place-items: center;
  }
  .fpo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fpo svg line { stroke: var(--guide); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .fpo h1 {
    position: relative;
    margin: 0;
    padding: 0 14px;
    background: var(--paper);
    font-size: clamp(48px, 10vw, 76px);
    line-height: 1;
    font-weight: 800;
    font-variation-settings: "wdth" 125;
    letter-spacing: -0.02em;
  }
  .intro { max-width: 52ch; color: var(--ink-soft); margin: 0; }
  .intro strong { color: var(--ink); font-weight: 600; }
  .intro a { color: inherit; text-underline-offset: 3px; }

  /* Controls */
  .controls {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--guide);
  }
  .controls .wrap { display: flex; flex-wrap: wrap; gap: 10px 28px; padding-top: 12px; padding-bottom: 12px; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
  .group > span { color: var(--ink-soft); margin-right: 6px; font-size: 13px; }
  .chip {
    font: inherit; font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 4px 11px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--crop); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip:disabled { opacity: .35; cursor: default; border-color: transparent; }
  :focus-visible { outline: 2px solid var(--hit); outline-offset: 2px; }

  /* Sections */
  main { padding-bottom: 80px; }
  section { margin-top: 44px; }
  section h2 {
    margin: 0 0 16px;
    font-size: 20px;
    font-weight: 700;
    font-variation-settings: "wdth" 112;
    display: flex; align-items: baseline; gap: 10px;
  }
  section h2 small { font-size: 14px; font-weight: 400; color: var(--ink-soft); font-variation-settings: "wdth" 100; }

  .grid {
    display: grid;
    gap: 22px 18px;
    grid-template-columns: repeat(auto-fill, minmax(var(--min, 150px), 1fr));
  }
  .grid[data-shape="cinema"]    { --min: 300px; }
  .grid[data-shape="landscape"] { --min: 220px; }
  .grid[data-shape="portrait"]  { --min: 140px; }
  .grid[data-shape="square"]    { --min: 150px; }
  @media (max-width: 480px) {
    .grid[data-shape="cinema"], .grid[data-shape="landscape"] { --min: 100%; }
    .grid[data-shape="portrait"], .grid[data-shape="square"] { --min: 130px; }
  }

  /* Tiles with crop marks */
  .tile {
    all: unset;
    display: block;
    cursor: copy;
    position: relative;
    min-width: 0;
  }
  .frame { position: relative; background: var(--tile); aspect-ratio: var(--ar); }
  .frame img, .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .crop { position: absolute; inset: -7px; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .crop i { position: absolute; width: 10px; height: 10px; border: 0 solid var(--ink); }
  .crop i:nth-child(1) { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
  .crop i:nth-child(2) { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
  .crop i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
  .crop i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
  .tile:hover .crop, .tile:focus-visible .crop { opacity: 1; }
  .tile:focus-visible { outline: none; }
  .tile:focus-visible .crop i { border-color: var(--hit); }
  .tile.copied .crop { opacity: 1; }
  .tile.copied .crop i { border-color: var(--hit); }
  .cap { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; font-size: 13px; line-height: 1.3; }
  .cap b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap span { color: var(--ink-soft); white-space: nowrap; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 10;
    transform: translate(-50%, 12px);
    max-width: calc(100% - 2 * var(--gutter));
    background: var(--ink); color: var(--paper);
    padding: 10px 16px; border-radius: 8px;
    font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast b { color: var(--guide); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .toast b { color: var(--hit); } }

  .empty, .error { color: var(--ink-soft); margin-top: 48px; }

  @media (prefers-reduced-motion: reduce) {
    .crop, .toast { transition: none; }
  }
</style>
</head>
<body>

<header class="wrap masthead">
  <div class="fpo">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/>
    </svg>
    <h1>media</h1>
  </div>
  <p class="intro">
    Placeholder images and video for prototypes. <strong>Click any file to copy it</strong>
    as a URL, an HTML tag or a CSS background. Everything is also listed in
    <a href="manifest.json">manifest.json</a>.
  </p>
</header>

<div class="controls" role="toolbar" aria-label="Filters">
  <div class="wrap">
    <div class="group" id="cats"><span>Show</span></div>
    <div class="group" id="shapes"><span>Shape</span></div>
    <div class="group" id="formats"><span>Copy as</span></div>
  </div>
</div>

<main class="wrap" id="out" aria-live="polite"></main>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const CATS = [
    ["all", "Everything"], ["dessert", "Dessert"], ["fruit", "Fruit"],
    ["interior-design", "Interior design"], ["oversize", "Oversize"],
    ["male", "Male"], ["female", "Female"], ["vids", "Video"]
  ];
  const SHAPES = [["all", "All"], ["cinema", "Cinema"], ["landscape", "Landscape"], ["portrait", "Portrait"], ["square", "Square"]];
  const FORMATS = [["url", "URL"], ["html", "HTML"], ["css", "CSS"]];
  const LABEL = Object.fromEntries(CATS);

  const state = { cat: "all", shape: "all", format: "url" };
  try {
    const saved = JSON.parse(localStorage.getItem("fpo-media") || "{}");
    if (FORMATS.some(f => f[0] === saved.format)) state.format = saved.format;
  } catch (e) {}
  const fromHash = new URLSearchParams(location.hash.slice(1));
  if (CATS.some(c => c[0] === fromHash.get("show"))) state.cat = fromHash.get("show");
  if (SHAPES.some(s => s[0] === fromHash.get("shape"))) state.shape = fromHash.get("shape");

  const $ = id => document.getElementById(id);
  let manifest, base;

  function chips(el, list, key) {
    for (const [value, text] of list) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = text; b.dataset.value = value;
      b.addEventListener("click", () => {
        state[key] = value;
        if (key === "format") { try { localStorage.setItem("fpo-media", JSON.stringify({ format: value })); } catch (e) {} }
        else history.replaceState(null, "", "#" + new URLSearchParams({ show: state.cat, shape: state.shape }));
        sync(); if (key !== "format") render();
      });
      el.appendChild(b);
    }
  }

  function shapesFor(cat) {
    if (cat === "vids") return Object.keys(manifest.videos);
    if (cat === "all") return SHAPES.slice(1).map(s => s[0]);
    return Object.keys(manifest.images[cat]);
  }

  function sync() {
    const available = shapesFor(state.cat);
    if (state.shape !== "all" && !available.includes(state.shape)) state.shape = "all";
    for (const b of document.querySelectorAll("#cats .chip")) b.setAttribute("aria-pressed", b.dataset.value === state.cat);
    for (const b of document.querySelectorAll("#shapes .chip")) {
      b.setAttribute("aria-pressed", b.dataset.value === state.shape);
      b.disabled = b.dataset.value !== "all" && !available.includes(b.dataset.value);
    }
    for (const b of document.querySelectorAll("#formats .chip")) b.setAttribute("aria-pressed", b.dataset.value === state.format);
  }

  function groups() {
    const cats = state.cat === "all" ? CATS.slice(1).map(c => c[0]) : [state.cat];
    const out = [];
    for (const cat of cats) {
      const shapes = cat === "vids" ? manifest.videos : manifest.images[cat];
      for (const shape of Object.keys(shapes)) {
        if (state.shape !== "all" && shape !== state.shape) continue;
        out.push({ cat, shape, items: shapes[shape], video: cat === "vids" });
      }
    }
    return out;
  }

  function snippet(item, video) {
    const url = base + item.src;
    if (state.format === "html") {
      return video
        ? `<video src="${url}" autoplay muted loop playsinline width="${item.width}" height="${item.height}"></video>`
        : `<img src="${url}" alt="" width="${item.width}" height="${item.height}">`;
    }
    if (state.format === "css") {
      return video ? url : `background: url("${url}") center / cover;`;
    }
    return url;
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const t = document.createElement("textarea");
      t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      const ok = document.execCommand("copy"); t.remove(); return ok;
    }
  }

  let toastTimer;
  function toast(html) {
    const el = $("toast"); el.innerHTML = html; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  function tile(item, video) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile";
    const name = item.src.replace(/^vids\//, "");
    const meta = video ? `${item.duration}s${item.audio ? ", sound" : ""}` : `${item.width}×${item.height}`;
    b.setAttribute("aria-label", `Copy ${item.src}`);
    b.innerHTML = `<div class="frame" style="--ar:${item.width}/${item.height}"><div class="crop"><i></i><i></i><i></i><i></i></div></div>
      <div class="cap"><b>${name}</b><span>${meta}</span></div>`;
    const frame = b.firstElementChild;
    if (video) {
      const v = document.createElement("video");
      v.src = item.src + "#t=0.1"; v.muted = true; v.loop = true; v.playsInline = true; v.preload = "metadata";
      frame.prepend(v);
      b.addEventListener("pointerenter", () => v.play().catch(() => {}));
      b.addEventListener("pointerleave", () => { v.pause(); });
    } else {
      const img = document.createElement("img");
      img.src = item.src; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
      img.width = item.width; img.height = item.height;
      frame.prepend(img);
    }
    b.addEventListener("click", async () => {
      const text = snippet(item, video);
      const ok = await copy(text);
      const fell = video && state.format === "css";
      toast(ok ? `Copied <b>${item.src}</b> as ${fell ? "a URL (videos have no CSS form)" : FORMATS.find(f => f[0] === state.format)[1]}` : "Couldn't copy. Your browser blocked clipboard access.");
      b.classList.add("copied"); setTimeout(() => b.classList.remove("copied"), 900);
    });
    return b;
  }

  function render() {
    const out = $("out"); out.textContent = "";
    const gs = groups();
    if (!gs.length) { out.innerHTML = `<p class="empty">Nothing in that shape. Pick another shape or show everything.</p>`; return; }
    for (const g of gs) {
      const s = document.createElement("section");
      const title = `${LABEL[g.cat]}, ${g.shape}`;
      s.innerHTML = `<h2>${title} <small>${g.items.length} ${g.video ? "clips" : "images"}</small></h2>`;
      const grid = document.createElement("div");
      grid.className = "grid"; grid.dataset.shape = g.shape;
      for (const item of g.items) grid.appendChild(tile(item, g.video));
      s.appendChild(grid); out.appendChild(s);
    }
  }

  chips($("cats"), CATS, "cat");
  chips($("shapes"), SHAPES, "shape");
  chips($("formats"), FORMATS, "format");

  fetch("manifest.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(m => { manifest = m; base = m.base; sync(); render(); })
    .catch(() => {
      $("out").innerHTML = `<p class="error">Couldn't load manifest.json. Open this page from GitHub Pages or a local server, not straight from the file.</p>`;
    });
})();
</script>
</body>
</html>
